server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app uses client-side routing, so nginx has no file at /problems, /leaderboard or
    # /problem/<id>. Without this fallback, refreshing or deep-linking any of those returns a
    # 404 from nginx instead of loading the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset filenames, so a given file never changes and may be
    # cached indefinitely. index.html itself is deliberately left out of this.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
