services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: divzero
      POSTGRES_USER: divzero
      POSTGRES_PASSWORD: divzero
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divzero -d divzero"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The public API. It never runs submissions and deliberately has NO Docker socket, so a
  # compromise of this internet-facing process does not hand out root on the host.
  api:
    build:
      context: ./api
    environment: &api-environment
      PORT: 3000
      DATABASE_URL: jdbc:postgresql://postgres:5432/divzero
      DATABASE_USERNAME: divzero
      DATABASE_PASSWORD: divzero
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # PLACEHOLDER ONLY - local development. Must be overridden with a random,
      # secret value (>= 32 characters) in any real deployment.
      JWT_SECRET: REPLACE-ME-local-dev-only-jwt-secret-0123456789
      FRONTEND_URL: http://localhost:5173
      DOCKER_COMMAND: docker
      # NOT under /tmp: the judge compiles the submission into this directory and then
      # executes it from a sibling container. Many hosts mount /tmp noexec (Docker Desktop's
      # VM does), which lets compilation succeed and then fails every run with exit 126,
      # "Permission denied". This path must stay identical on the host and inside the api
      # container, because the judge passes it straight to "docker run -v <path>:/code".
      JUDGE_WORKSPACE_ROOT: /var/lib/divzero-workspaces
      JUDGE_DOCKER_IMAGE: frolvlad/alpine-gxx
      JUDGE_MEMORY: 256m
      JUDGE_CPUS: "0.5"
      JUDGE_EXECUTION_TIMEOUT_MS: 10000
      JUDGE_COMPILE_TIMEOUT_MS: 120000
      JUDGE_WORKER_ENABLED: "false"
    ports:
      - "3000:3000"
    depends_on: &api-depends-on
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The judge: same image, consumes submissions from Kafka and runs them in sibling containers.
  # It is the only service with the Docker socket, and it publishes no ports, so nothing outside
  # the compose network can reach it. The socket still grants root on the host to this process;
  # see "Known Limitations" in README.md.
  judge:
    build:
      context: ./api
    environment:
      <<: *api-environment
      JUDGE_WORKER_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/divzero-workspaces:/var/lib/divzero-workspaces
    depends_on: *api-depends-on

  client:
    build:
      context: ./client
      args:
        # Baked into the JS bundle at build time -- Vite inlines import.meta.env.VITE_*, so this
        # cannot be a runtime environment variable (see client/Dockerfile). It is the address the
        # browser uses, and it must match the origin allowed by the api service's FRONTEND_URL.
        VITE_API_BASE: http://localhost:3000/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
  kafka-data:
  redis-data:
